<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一起旅行">
<meta name="theme-color" content="#f3eedc">
<title>一起去旅行</title>
<style>
  :root {
    --bg: #f3eedc; --paper: #faf6ea; --white: #fffdf7; --text: #4a3a2c; --muted: #9a8b78; --line: #ebe2cc;
    --brown: #5b3416; --blue: #4f86c0; --sky: #bfdeea; --pink: #dc9a9b; --butter: #fcf0d4; --yellow: #f6cf5c;
    --orange: #eda04a; --nose: #e0482f; --green: #3f8a6e; --warn: #c8553d; --ok: #3f8a6e;
    --round: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "PingFang SC", sans-serif;
    --r: 28px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { min-height: 100vh; background: radial-gradient(120% 60% at 80% 40%, #f8e3c8 0%, transparent 60%), var(--bg); background-attachment: fixed; }
  #app { max-width: 520px; margin: 0 auto; padding: 14px 16px 120px; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  h1 { font: 800 22px/1.25 var(--round); color: var(--brown); margin: 0; }
  h2 { font: 800 17px/1.3 var(--round); color: var(--brown); margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .num { font: 900 54px/0.95 var(--round); color: var(--brown); letter-spacing: -1px; }

  .top { display: flex; align-items: center; gap: 10px; padding: 6px 0 16px; }
  .top .tt { flex: 1; min-width: 0; }
  .back { font: 700 30px/1 var(--round); color: var(--brown); padding: 0 6px 4px 0; }
  .icon-btn { border: 0; background: var(--white); border-radius: 16px; width: 42px; height: 42px; font-size: 18px; box-shadow: 0 2px 0 var(--line); }
  .banner { background: var(--white); border: 2px dashed #d9cba9; color: var(--muted); border-radius: 18px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .sec-title { display: flex; align-items: center; gap: 6px; margin: 22px 4px 10px; }

  /* 组件卡片 */
  .w { position: relative; overflow: hidden; border-radius: var(--r); box-shadow: 0 6px 18px rgba(120,80,30,.08); margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid2 .w { margin: 0; aspect-ratio: 1 / 1; padding: 16px; cursor: pointer; }
  .w-cream { background: var(--white); }
  .w-blue { background: var(--blue); }
  .w-blue .num { color: #fdf3d6; }
  .w-blue .lbl { color: #fdf3d6; }
  .w .lbl { font: 700 15px/1.3 var(--round); color: var(--brown); margin-top: 4px; }
  .w .right { text-align: right; position: relative; z-index: 2; }
  .w .char { position: absolute; z-index: 1; pointer-events: none; }
  .w .sun { position: absolute; width: 38px; height: 38px; z-index: 1; }

  .w-grid { background-color: var(--sky);
    background-image: linear-gradient(rgba(255,255,255,.75) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.75) 2px, transparent 2px);
    background-size: 24px 24px; background-position: -2px -2px; padding: 12px; display: flex; align-items: center; min-height: 150px; }
  .w-grid .char { position: static; width: 104px; flex-shrink: 0; margin: 0 4px 0 -2px; }
  .bubble-card { flex: 1; min-width: 0; background: var(--white); border-radius: 22px; padding: 14px 16px; position: relative; }
  .bubble-card::before { content: ""; position: absolute; left: -7px; top: 50%; width: 14px; height: 14px; background: var(--white); transform: translateY(-50%) rotate(45deg); border-radius: 3px; }
  .next-name { font: 800 16px/1.35 var(--round); color: var(--brown); margin: 4px 0 2px; word-break: break-all; }
  .left-pill { display: inline-block; margin-top: 6px; font: 700 12.5px/1 var(--round); background: var(--butter); color: var(--brown); padding: 6px 10px; border-radius: 99px; }
  .left-pill.soon { background: var(--nose); color: #fff; }

  /* 清单 */
  .w-todo { background: var(--butter); }
  .todo-head { position: relative; height: 128px; background: var(--pink); }
  .todo-head .palm { position: absolute; bottom: -4px; width: 64px; }
  .todo-head .hand { position: absolute; left: 50%; top: 14px; transform: translateX(-50%) rotate(-8deg); font: italic 600 26px/1 "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive; color: #fdf3d6; white-space: nowrap; text-shadow: 0 2px 0 rgba(91,52,22,.25); }
  .todo-head .char { left: 50%; bottom: -26px; width: 104px; transform: translateX(-50%); }
  .todo-body { padding: 34px 22px 18px; }
  .todo-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 15px; }
  .box { width: 20px; height: 20px; border: 2px solid #cdbf9f; border-radius: 6px; background: var(--white); flex-shrink: 0; display: grid; place-items: center; font-size: 13px; color: #fff; }
  .todo-row.done .box { background: var(--green); border-color: var(--green); }
  .todo-row.done .tx-main { color: var(--muted); }
  .todo-row.miss .tx-main { font-weight: 600; }
  .todo-row .tx-main { flex: 1; min-width: 0; cursor: pointer; }
  .todo-row .tx-main small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .mini { border: 0; border-radius: 99px; padding: 5px 11px; font-size: 12.5px; background: var(--white); color: var(--muted); }
  .mini.go { background: var(--brown); color: #fdf3d6; font-weight: 600; }
  .linkish { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 6px 0 0; }

  /* 每日行程 */
  .daycard { background: var(--white); border-radius: 24px; padding: 14px 14px 8px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(120,80,30,.06); }
  .daycard.today { box-shadow: 0 0 0 3px var(--yellow), 0 4px 12px rgba(120,80,30,.06); }
  .dc-head { display: flex; align-items: baseline; gap: 8px; margin: 0 4px 8px; }
  .dc-date { font: 900 26px/1 var(--round); color: var(--brown); }
  .dc-week { font: 700 14px var(--round); color: var(--brown); }
  .dc-n { margin-left: auto; font: 700 12px/1 var(--round); background: var(--butter); color: var(--brown); padding: 5px 9px; border-radius: 99px; }
  .daycard.today .dc-n { background: var(--yellow); }
  .ri { display: flex; gap: 12px; align-items: flex-start; padding: 10px 4px; border-top: 1.5px dashed var(--line); cursor: pointer; }
  .dc-head + .ri, .daycard > .ri:first-child { border-top: 0; }
  .ri.past { opacity: .5; }
  .ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
  .t-flight { background: #dbe8f6; } .t-train { background: #f7dcdc; } .t-bus { background: #d9eee3; }
  .t-hotel { background: #fbecc4; } .t-ticket { background: #d8ecf3; } .t-expense { background: #fde3cf; }
  .ri-body { flex: 1; min-width: 0; }
  .ri-title { font-weight: 700; color: var(--text); word-break: break-all; }
  .ri-title .tm { font: 800 15px var(--round); color: var(--brown); margin-right: 6px; }
  .code { font-size: 11.5px; background: var(--butter); color: var(--brown); border-radius: 6px; padding: 1px 6px; font-weight: 600; margin-left: 4px; }
  .ri-sub { font-size: 13px; color: var(--muted); }
  .who { font-size: 12px; color: #b0703a; margin-top: 2px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; word-break: break-all; }
  .cal { border: 0; background: var(--butter); border-radius: 12px; width: 36px; height: 36px; font-size: 16px; flex-shrink: 0; }
  .night { display: block; width: 100%; text-align: left; border: 0; background: #f6f1e3; border-radius: 14px; font-size: 13px; color: var(--muted); padding: 7px 12px; margin: 4px 0 6px; }
  .night.missing { background: #fbe4dc; color: var(--warn); font-weight: 600; }

  /* 费用 */
  .w-money { background: var(--yellow); padding: 18px; }
  .w-money .char { right: 14px; top: 12px; width: 78px; }
  .w-money .lbl { margin: 2px 0 12px; }
  .money-inner { background: var(--white); border-radius: 20px; padding: 10px 14px 12px; position: relative; z-index: 2; }
  .money-inner table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .money-inner td { padding: 7px 0; border-top: 1.5px dashed var(--line); }
  .money-inner tr:first-child td { border-top: 0; }
  .money-inner td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .tx { background: var(--butter); color: var(--brown); border-radius: 14px; padding: 9px 12px; margin-top: 8px; font: 800 15px var(--round); }
  .tx.ok { background: #dcefe4; color: var(--ok); }

  /* 首页旅行卡 */
  .trip-w { display: flex; align-items: flex-end; min-height: 150px; padding: 18px; }
  .trip-w .info { position: relative; z-index: 2; max-width: 64%; }
  .trip-w .tname { font: 800 19px/1.3 var(--round); color: var(--brown); margin-top: 6px; }
  .trip-w .char { right: -6px; bottom: -10px; width: 120px; }
  .trip-w.w-blue .tname, .trip-w.w-blue .muted { color: #fdf3d6; }
  .trip-w.w-pink { background: var(--pink); }
  .trip-w.w-pink .num, .trip-w.w-pink .tname { color: #fffaf0; } .trip-w.w-pink .muted, .trip-w.w-pink .lbl { color: #fff4ea; }
  .trip-w.w-grid { display: flex; }
  .pill { display: inline-block; font: 700 12px/1 var(--round); padding: 6px 10px; border-radius: 99px; margin-top: 8px; background: var(--white); color: var(--warn); }
  .pill.ok { color: var(--ok); } .pill.gray { color: var(--muted); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0; font-size: 13px; }
  .tools button, .tools select { border: 0; background: var(--white); border-radius: 99px; padding: 8px 13px; font-size: 13px; color: var(--brown); box-shadow: 0 2px 0 var(--line); }
  .tools select { display: inline-block; width: auto; min-height: 0; margin: 0; }
  .sync { color: var(--muted); font-size: 12px; margin-left: auto; }

  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(243,238,220,0), var(--bg) 35%); display: flex; gap: 10px; justify-content: center; z-index: 5; }
  .bottom-bar .btn { flex: 1; max-width: 244px; }
  .btn { border: 0; border-radius: 99px; padding: 14px 16px; font: 800 15px/1.2 var(--round); background: var(--white); color: var(--brown);
    box-shadow: 0 3px 0 var(--line), 0 6px 16px rgba(120,80,30,.1); }
  .btn.primary { background: var(--brown); color: #fdf3d6; box-shadow: 0 3px 0 #3a200c, 0 6px 16px rgba(91,52,22,.25); }
  .btn.danger { background: #fbe4dc; color: var(--warn); box-shadow: none; }

  /* 弹层 */
  .sheet { position: fixed; inset: 0; z-index: 10; }
  .sheet.hidden { display: none; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(60,36,16,.35); }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--paper);
    border-radius: 30px 30px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .x { border: 0; background: var(--white); border-radius: 99px; width: 34px; height: 34px; color: var(--brown); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border: 0; background: var(--white); border-radius: 99px; padding: 7px 12px; font-size: 13px; color: var(--brown); box-shadow: 0 2px 0 var(--line); }
  .chip.on { background: var(--brown); color: #fdf3d6; box-shadow: none; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; flex: 1; min-width: 0; }
  input, select, textarea { display: block; width: 100%; margin-top: 4px; border: 2px solid var(--line); background: var(--white); border-radius: 14px;
    padding: 9px 12px; font: inherit; font-size: 16px; color: var(--text); -webkit-appearance: none; appearance: none; min-height: 44px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--yellow); }
  input[type=checkbox] { display: inline; width: auto; min-height: 0; margin: 0 5px 0 0; -webkit-appearance: checkbox; appearance: checkbox; accent-color: var(--brown); }
  .row { display: flex; gap: 10px; }
  .split { margin-bottom: 10px; }
  .split .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .ck { display: inline-flex; align-items: center; margin: 0 14px 0 0; color: var(--text); font-size: 15px; flex: none; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 8px; }
  .sheet-actions .btn { flex: 1; }
  .member-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .member-row input { margin: 0; }
  .member-row button { border: 0; background: none; color: var(--muted); font-size: 18px; }
  .toast { position: fixed; left: 50%; top: 20px; transform: translate(-50%, -90px); background: var(--brown); color: #fdf3d6; padding: 9px 18px;
    border-radius: 99px; font-size: 14px; transition: transform .25s; z-index: 20; max-width: 90vw; }
  .toast.show { transform: translate(-50%, 0); }
  .photo-btn { display: block; text-align: center; margin: 0; cursor: pointer; }
  .photo-btn input { display: none; }
  /* 底部 Tab */
  #app { padding-bottom: 130px; }
  .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 496px;
    display: flex; align-items: center; justify-content: space-around; background: var(--white); border-radius: 30px; padding: 7px 6px;
    box-shadow: 0 4px 0 var(--line), 0 10px 28px rgba(120,80,30,.16); z-index: 6; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font: 700 11.5px/1.2 var(--round); color: var(--muted); padding: 6px 0; border-radius: 22px; position: relative; }
  .tab .ti { font-size: 20px; line-height: 1.1; filter: grayscale(.6); opacity: .75; }
  .tab.on { color: var(--brown); background: var(--butter); }
  .tab.on .ti { filter: none; opacity: 1; }
  .tab .dot { position: absolute; top: 5px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--nose); }
  .tab-add { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--brown); color: #fdf3d6; font: 700 30px/1 var(--round);
    margin: -26px 4px 0; box-shadow: 0 4px 0 #3a200c, 0 8px 18px rgba(91,52,22,.3); flex-shrink: 0; }

  /* 费用页 */
  .paid-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
  .paid-row .pn { width: 56px; font-weight: 700; color: var(--brown); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .paid-row .bar { flex: 1; height: 10px; background: #f3ead2; border-radius: 99px; overflow: hidden; }
  .paid-row .bar i { display: block; height: 100%; background: var(--orange); border-radius: 99px; }
  .paid-row .pv { font-variant-numeric: tabular-nums; color: var(--text); font-size: 13px; min-width: 92px; text-align: right; }
  .btn.settle { display: block; width: 100%; margin-top: 14px; background: var(--brown); color: #fdf3d6; font-size: 17px; padding: 15px; box-shadow: 0 4px 0 #3a200c; position: relative; z-index: 2; }
  .btn.settle.done { background: var(--white); color: var(--ok); box-shadow: 0 4px 0 #d9b94a; }
  .amt { font: 800 15px var(--round); color: var(--brown); white-space: nowrap; padding-top: 9px; }
  .settle-card { background: var(--white); border-radius: 24px; padding: 18px; margin-bottom: 8px; }
  .settle-tx { display: flex; align-items: center; gap: 8px; background: var(--butter); border-radius: 18px; padding: 14px 16px; margin-top: 10px; font: 700 16px var(--round); color: var(--brown); }
  .settle-tx .arrow { font-size: 13px; color: var(--muted); }
  .settle-tx .sv { margin-left: auto; font: 900 22px var(--round); }
  .settle-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 12px; }
  .settle-table td { padding: 6px 0; border-top: 1.5px dashed var(--line); }
  .settle-table tr:first-child td { border-top: 0; }
  .settle-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }

  /* 菜单列表 */
  .menu { background: var(--white); border-radius: 24px; padding: 6px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(120,80,30,.06); }
  .menu > button, .menu > a { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 10px; border-radius: 18px; font-size: 15px; font-weight: 600; color: var(--text); }
  .menu > button + button, .menu > button + a { border-top: 1.5px dashed var(--line); border-radius: 0; }
  .menu small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  /* 下一项横条 */
  .cd-pre { font: 700 13px/1.2 var(--round); color: var(--muted); }
  .cd-line { font: 800 15px/1 var(--round); color: var(--brown); margin: 6px 0 4px; display: flex; align-items: baseline; gap: 4px; }
  .cd-num { font: 900 34px/1 var(--round); color: var(--nose); letter-spacing: -0.5px; }
  .pin-menu > button.on { background: var(--butter); }
  .pin-menu .pick { margin-left: auto; color: var(--green); font-size: 18px; }
  .menu > button > span:not(.ic) { flex: 1; min-width: 0; }
  .ticket { display: flex; background: none; box-shadow: none; overflow: visible; cursor: pointer; }
  .ticket .stub-l { flex: 1; min-width: 0; background: var(--white); border-radius: 24px 0 0 24px; padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 18px rgba(120,80,30,.08); }
  .ticket .stub-r { width: 100px; flex-shrink: 0; background: var(--yellow); border-radius: 0 24px 24px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-left: 3px dashed #fff7e0; box-shadow: 0 6px 18px rgba(120,80,30,.08); padding: 10px 4px; }
  .ticket .stub-r::before, .ticket .stub-r::after { content: ""; position: absolute; left: -12px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
  .ticket .stub-r::before { top: -10px; } .ticket .stub-r::after { bottom: -10px; }
  .ticket .stub-r .cd-num { font-size: 46px; color: var(--brown); } .ticket .stub-r .cd-num.sm { font-size: 30px; }
  .ticket .stub-r small { font: 800 13px var(--round); color: var(--brown); }
  .ticket .route { font: 900 19px/1.25 var(--round); color: var(--brown); margin: 3px 0 2px; word-break: break-all; }
  .ticket .char { position: static; width: 78px; flex-shrink: 0; }
  .ticket .photo { width: 78px; height: 78px; border-radius: 18px; flex-shrink: 0; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(60,36,16,.18); }
  .img-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .img-row label { display: inline-block; flex: none; margin: 0; color: var(--brown); cursor: pointer; }
  .img-row input { display: none; }
  .img-prev { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(60,36,16,.15); }
  .tip { background: var(--pink); padding: 18px; }
  .tip .char { right: 14px; top: 12px; width: 62px; }
  .tip-sub { color: #fff4ea; font-size: 13px; margin: 4px 0 12px; }
  .tip-seg { display: inline-flex; background: rgba(255,255,255,.35); border-radius: 99px; padding: 3px; margin-bottom: 12px; }
  .tip-seg button { border: 0; background: none; border-radius: 99px; padding: 6px 16px; font: 700 13px var(--round); color: #fffaf0; }
  .tip-seg button.on { background: var(--white); color: var(--brown); }
  .tip-qr { background: var(--white); border-radius: 22px; padding: 16px; text-align: center; position: relative; z-index: 2; }
  .tip-qr img { width: 220px; height: auto; object-fit: contain; display: block; margin: 0 auto 8px; border-radius: 10px; }
  .fb { padding: 14px 16px; }
  .fb.todo { box-shadow: 0 0 0 3px var(--yellow), 0 4px 12px rgba(120,80,30,.06); }
  .fb-meta { font-size: 12px; color: var(--muted); }
  .fb-text { margin: 4px 0 8px; white-space: pre-wrap; word-break: break-all; }
  .fb-reply { background: var(--butter); border-radius: 16px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; }
  .fb-reply b { display: block; font: 800 13px var(--round); color: var(--brown); margin-bottom: 2px; }
  .fb-wait { font-size: 13px; color: var(--muted); background: #f6f1e3; border-radius: 12px; padding: 6px 10px; display: inline-block; }
  .new-badge { font: 700 11px/1 var(--round); background: var(--nose); color: #fff; padding: 3px 7px; border-radius: 99px; margin-left: 4px; vertical-align: 1px; }
  .cal-card { background: var(--white); border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; }
  .cal-h { font: 800 16px/1.3 var(--round); color: var(--brown); margin-bottom: 2px; }

// PARSER-START
const WEEK = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toDate = (date, time) => {
  if (!date) return null;
  const [y, m, d] = date.split('-').map(Number);
  const [h, mi] = (time || '00:00').split(':').map(Number);
  return new Date(y, m - 1, d, h || 0, mi || 0);
};
const addDays = (date, n) => { const d = toDate(date); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);

function fixYear(y, mo, d, trip) {
  if (y) return `${y}-${pad(mo)}-${pad(d)}`;
  const ref = trip && trip.start ? toDate(trip.start) : new Date();
  const base = ref.getFullYear();
  let best = null;
  for (const yy of [base - 1, base, base + 1]) {
    const c = new Date(yy, mo - 1, d);
    if (!best || Math.abs(c - ref) < Math.abs(best - ref)) best = c;
  }
  return ymd(best);
}

function cleanPlace(p) {
  return (p || '')
    .replace(/^.*[号次日的购从在于由往至到开乘自订经]/, '')
    .replace(/^.*航空(公司)?/, '')
    .replace(/^达/, '')
    .replace(/国际机场|机场/, '')
    .trim();
}

function parseText(raw, trip) {
  const s = raw.replace(/：/g, ':').replace(/，/g, ',').replace(/\s+/g, ' ');
  const has = re => re.test(s);
  const r = {};
  const notes = [];

  const trainCode = s.match(/(?<![A-Za-z0-9])([GDCZTKYSL]\d{1,4})次/)
    || (has(/12306|铁路|火车|高铁|动车/) && s.match(/(?<![A-Za-z0-9])([GDCZTK]\d{1,4})(?![0-9])/));
  const flightCode = s.match(/(?<![A-Za-z0-9])((?:[A-Z]{2}|[A-Z]\d|\d[A-Z])\s?\d{3,4})(?![0-9])/);

  let type = 'expense';
  if (trainCode) type = 'train';
  else if (has(/酒店|宾馆|民宿|客栈|旅馆|饭店|度假村|入住|离店|退房|hotel|inn/i) && !has(/航班|起飞|登机/)) type = 'hotel';
  else if (has(/航班|机票|起飞|登机|航空|机场/) || (flightCode && has(/航|飞|T\d/))) type = 'flight';
  else if (has(/大巴|客运|汽车票|船票|轮渡|巴士/)) type = 'bus';
  else if (has(/门票|入园|景区|演出|展览|乐园|票/)) type = 'ticket';
  r.type = type;

  // 日期
  const dates = [];
  const dre = /(\d{4})\s*[-\/.年]\s*(\d{1,2})\s*[-\/.月]\s*(\d{1,2})|(?<!\d)(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?|(?<![\d.:])(\d{1,2})[-\/](\d{1,2})(?![\d:\/])/g;
  let m;
  while ((m = dre.exec(s))) {
    const y = m[1] ? +m[1] : null, mo = +(m[2] || m[4] || m[6]), d = +(m[3] || m[5] || m[7]);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) continue;
    dates.push(fixYear(y, mo, d, trip));
  }
  // 时间
  const times = [...s.matchAll(/(?<![\d:])([01]?\d|2[0-3]):([0-5]\d)(?!\d)/g)].map(x => pad(+x[1]) + ':' + x[2]);
  // 金额
  const num = '[¥￥]?\\s*(\\d+(?:\\.\\d{1,2})?)';
  const am = s.match(new RegExp('(?:合计|共计|总价|总额|实付|订单金额|支付金额)\\s*:?\\s*' + num))
    || s.match(/(?:[¥￥]|RMB|CNY)\s*(\d+(?:\.\d{1,2})?)/i)
    || s.match(new RegExp('(?:金额|房费|票价|支付|价格|费用)\\s*:?\\s*' + num))
    || s.match(/(\d+(?:\.\d{1,2})?)\s*元/);
  if (am) r.amount = am[1];
  // 备注信息
  const ord = s.match(/(?:订单编号|订单号|订单|确认号|预订号)\s*:?\s*([A-Z0-9]{5,})/i);
  if (ord) notes.push('订单 ' + ord[1]);
  const seat = s.match(/(\d{1,2}车\d{1,3}[A-F]?号?)/);
  if (seat) notes.push(seat[1]);
  const gate = s.match(/检票口\s*:?\s*([A-Z0-9]+)/i);
  if (gate) notes.push('检票口 ' + gate[1]);

  const routeRe = /([\u4e00-\u9fa5]{2,12}(?:T\d)?)\s*(?:-|—|–|→|->|至|飞往|开往)\s*([\u4e00-\u9fa5]{2,12}(?:T\d)?)/;

  if (type === 'train' || type === 'flight' || type === 'bus') {
    if (type === 'train') {
      r.code = trainCode[1];
      const st = [...new Set([...s.matchAll(/([\u4e00-\u9fa5]{2,8})站/g)].map(x => cleanPlace(x[1])).filter(x => x.length >= 2))];
      if (st[0]) r.from = st[0];
      if (st[1]) r.to = st[1];
      const to = s.match(/开往\s*([\u4e00-\u9fa5]{2,6})/);
      if (!r.to && to) r.to = to[1].replace(/站$/, '');
    }
    if (type === 'flight' && flightCode) r.code = flightCode[1].replace(/\s/g, '');
    if (!r.from || !r.to) {
      const rt = s.match(routeRe);
      if (rt) { r.from = r.from || cleanPlace(rt[1]); r.to = r.to || cleanPlace(rt[2]); }
    }
    if (type === 'flight' && (!r.from || !r.to)) {
      const ap = [...s.matchAll(/([\u4e00-\u9fa5]{2,8}?)(?:国际)?机场\s*(T\d)?/g)].map(x => cleanPlace(x[1]) + (x[2] || '')).filter(x => x.length >= 2);
      if (ap.length >= 2) { r.from = r.from || ap[0]; r.to = r.to || ap[1]; }
    }
    if (!r.from) { const x = s.match(/([\u4e00-\u9fa5]{2,12}(?:T\d)?)\s*(?:起飞|出发)/); if (x) r.from = cleanPlace(x[1]); }
    if (!r.to) { const x = s.match(/(?:到达|抵达)\s*([\u4e00-\u9fa5]{2,12}(?:T\d)?)/); if (x) r.to = cleanPlace(x[1]); }
    if (dates[0]) r.date = dates[0];
    if (times[0]) r.time = times[0];
    if (times[1] && r.date) {
      r.endTime = times[1];
      r.endDate = dates[1] && dates[1] >= r.date ? dates[1] : (times[1] < times[0] ? addDays(r.date, 1) : r.date);
    }
  } else if (type === 'hotel') {
    const hn = s.match(/([\u4e00-\u9fa5A-Za-z0-9·()（）]{2,40}?(?:酒店|宾馆|民宿|客栈|旅馆|饭店|度假村|公寓|Hotel|Inn))/i);
    const quoted = s.match(/[「“"《【]([^」”"》】]{2,40})[」”"》】]/g)?.map(x => x.slice(1, -1)).find(x => !/旅行|客服|携程|美团|飞猪|去哪儿|同程|艺龙|铁路/.test(x));
    if (quoted) r.title = quoted;
    else if (hn) r.title = hn[1].replace(/^.*(预订|预定|订购|已订|成功|您好|您)/, '').replace(/^[)）]/, '');
    if (dates[0]) r.date = dates[0];
    const nights = s.match(/(\d+)\s*晚/);
    if (dates[1] && dates[1] > dates[0]) r.endDate = dates[1];
    else if (r.date && nights) r.endDate = addDays(r.date, +nights[1]);
    else if (r.date) r.endDate = addDays(r.date, 1);
    const addr = s.match(/地址\s*:?\s*([^,，。;；\s]{4,40})/);
    if (addr) notes.push(addr[1]);
  } else {
    if (type === 'ticket') { const tn = s.match(/([\u4e00-\u9fa5A-Za-z0-9]{2,16}?(?:门票|演出票|入场券|票))/); if (tn) r.title = tn[1].replace(/^.*(预订|预定|购买|已购|成功|您)/, ''); }
    if (dates[0]) r.date = dates[0];
    if (times[0]) r.time = times[0];
  }
  if (notes.length) r.note = notes.join(' · ');
  return Object.fromEntries(Object.entries(r).filter(([, v]) => v !== undefined && v !== ''));
}
// PARSER-END

const dayLabel = date => { const d = toDate(date); return `${d.getMonth() + 1}/${d.getDate()} 周${WEEK[d.getDay()]}`; };
const fmtMoney = n => '¥' + (Math.round(n * 100) / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const todayStr = () => ymd(new Date());

// ====== 数据存储（预览模式存本机；配置后同步到 Supabase）======
const Store = {
  docs: LS.get('tt_docs', {}),
  pending: LS.get('tt_pending', []),
  status: REMOTE ? 'idle' : 'local',
  flushing: false,
  save() { LS.set('tt_docs', this.docs); LS.set('tt_pending', this.pending); },
  trips() { const mine = new Set(Mine.get()); return Object.values(this.docs).filter(d => d.kind === 'trip' && mine.has(d.id)).sort((a, b) => (b.data.start || '').localeCompare(a.data.start || '')); },
  items(tripId) { return Object.values(this.docs).filter(d => d.kind === 'item' && d.trip_id === tripId).map(d => d.data); },
  put(kind, tripId, data) {
    const doc = { id: data.id, kind, trip_id: tripId, data, updated_at: new Date().toISOString() };
    this.docs[doc.id] = doc;
    if (kind === 'trip') Mine.add(doc.id);
    if (REMOTE) this.pending.push({ op: 'up', doc });
    this.save(); this.flush();
  },
  del(id) {
    const trip_id = this.docs[id]?.trip_id;
    delete this.docs[id];
    if (REMOTE) this.pending.push({ op: 'del', id, trip_id });
    this.save(); this.flush();
  },
  async api(path, opts = {}, tripId = '') {
    const res = await fetch(CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/' + path, {
      ...opts,
      headers: { apikey: CONFIG.supabaseKey, ...(CONFIG.supabaseKey.startsWith('eyJ') ? { Authorization: 'Bearer ' + CONFIG.supabaseKey } : {}), 'Content-Type': 'application/json', 'x-trip-id': tripId, ...(opts.headers || {}) },
    });
    if (!res.ok) throw new Error(res.status + ' ' + await res.text());
    if (opts.json) return res.json();
    return opts.method && opts.method !== 'GET' ? null : res.json();
  },
  async flush() {
    if (!REMOTE || this.flushing) return;
    this.flushing = true;
    try {
      while (this.pending.length) {
        const p = this.pending[0];
        if (p.op === 'up') {
          const { id, kind, trip_id, data, updated_at } = p.doc;
          await this.api('docs?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ id, kind, trip_id, data, updated_at }) }, trip_id);
        } else {
          await this.api('docs?id=eq.' + encodeURIComponent(p.id), { method: 'DELETE' }, p.trip_id || '');
        }
        this.pending.shift(); this.save();
      }
      this.setStatus('ok');
    } catch (e) { console.warn(e); this.setStatus('offline'); }
    finally { this.flushing = false; }
  },
  async pull(tripId) {
    if (!REMOTE) return false;
    const match = d => d.trip_id === tripId;
    try {
      const rows = await this.api('docs?select=*&trip_id=eq.' + encodeURIComponent(tripId), {}, tripId);
      const pend = new Set(this.pending.map(p => p.op === 'up' ? p.doc.id : p.id));
      const remoteIds = new Set(rows.map(r => r.id));
      let changed = false;
      for (const d of Object.values(this.docs)) {
        if (match(d) && !remoteIds.has(d.id) && !pend.has(d.id)) { delete this.docs[d.id]; changed = true; }
      }
      for (const r of rows) {
        if (pend.has(r.id)) continue;
        const cur = this.docs[r.id];
        if (!cur || stable(cur.data) !== stable(r.data)) {
          this.docs[r.id] = { id: r.id, kind: r.kind, trip_id: r.trip_id, data: r.data, updated_at: r.updated_at };
          changed = true;
        }
      }
      this.save();
      this.setStatus(this.pending.length ? 'offline' : 'ok');
      return changed;
    } catch (e) { console.warn(e); this.setStatus('offline'); return false; }
  },
  setStatus(s) { this.status = s; const el = $('#sync'); if (el) el.textContent = statusText(); },
};

function missingList(trip, items) {
  const out = [];
  if (!trip.start || !trip.end) return out;
  const ign = new Set(trip.ignored || []);
  const tr = items.filter(i => TYPES[i.type]?.transport);
  if (!ign.has('out') && !tr.some(i => i.date === trip.start))
    out.push({ key: 'out', text: `去程交通（${dayLabel(trip.start)}）`, preset: { type: 'flight', date: trip.start } });
  if (trip.end !== trip.start && !ign.has('back') && !tr.some(i => i.date === trip.end))
    out.push({ key: 'back', text: `回程交通（${dayLabel(trip.end)}）`, preset: { type: 'flight', date: trip.end } });
  for (let n = trip.start; n < trip.end; n = addDays(n, 1)) {
    if (!ign.has('night:' + n) && !hotelFor(items, n))
      out.push({ key: 'night:' + n, text: `${dayLabel(n)} 晚上的住处`, preset: { type: 'hotel', date: n, endDate: addDays(n, 1) } });
  }
  return out;
}
const hotelFor = (items, night) => items.find(i => i.type === 'hotel' && i.date && i.date <= night && night < (i.endDate || addDays(i.date, 1)));

const P2 = n => String(n).padStart(2, '0');
function tripBig(trip) {
  const today = todayStr();
  if (!trip.start) return { num: '??', lbl: '日期未定' };
  if (today < trip.start) return { num: P2(daysBetween(today, trip.start)), lbl: '天后出发' };
  if (today > trip.end) return { num: 'OK', lbl: '旅行结束啦' };
  const n = daysBetween(trip.start, today) + 1;
  return { num: P2(n), lbl: today === trip.start ? '今天出发！' : `旅途第 ${n} 天` };
}
function tripPill(t) {
  const trip = t.data;
  if (trip.end && trip.end < todayStr()) return `<span class="pill gray">已结束</span>`;
  const n = missingList(trip, Store.items(t.id)).length;
  return n ? `<span class="pill">还缺 ${n} 项没订</span>` : `<span class="pill ok">✓ 都订好了</span>`;
}

function fmtLeft(ms) {
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
  if (d > 0) return `${d} 天 ${h} 小时`;
  if (h > 0) return `${h} 小时 ${mi} 分`;
  return `${mi} 分钟`;
}

function purposeCard(id, trip, items) {
  const today = todayStr(), now = new Date();
  const pin = trip.pinId && items.find(i => i.id === trip.pinId && i.date);
  const pic = pin && pin.img ? `<img class="photo" src="${esc(pin.img)}" alt="">` : CLOUD('char');
  let pre = '距离', name, sub = '', rTop = '还有', rNum = '', rUnit = '天';
  if (pin) {
    const at = itemStart(pin), days = daysBetween(today, pin.date);
    name = esc(itemName(pin)) + (pin.type === 'hotel' ? ' 入住' : '');
    sub = `${TYPES[pin.type].icon} ${dayLabel(pin.date)}${pin.time ? ' ' + esc(pin.time) : ''}`;
    if (at <= now) { pre = ''; rTop = ''; rNum = '✓'; rUnit = '完成啦'; }
    else if (days > 0) rNum = days;
    else { const m = Math.ceil((at - now) / 60000); if (m >= 60) { rNum = Math.floor(m / 60); rUnit = '小时'; } else { rNum = m; rUnit = '分钟'; } }
  } else if (!trip.start) {
    name = '出发'; sub = '先填好出发日期'; rTop = ''; rNum = '?'; rUnit = '';
  } else if (today < trip.start) {
    name = '出发'; sub = `🧳 ${dayLabel(trip.start)}`; rNum = daysBetween(today, trip.start);
  } else if (today <= trip.end) {
    const rest = daysBetween(today, trip.end);
    pre = '旅途中'; name = `第 ${daysBetween(trip.start, today) + 1} 天`; sub = `🧳 ${dayLabel(trip.start)} – ${dayLabel(trip.end)}`;
    if (rest) { rTop = '还剩'; rNum = rest; } else { rTop = ''; rNum = '最后'; rUnit = '一天'; }
  } else {
    pre = ''; name = '这次旅行'; sub = '圆满结束'; rTop = ''; rNum = '🎉'; rUnit = '';

function nextBar(items) {

function checklist(trip, items, miss) {
  const rows = [];
  if (!trip.start || !trip.end) return rows;
  const ign = new Set(trip.ignored || []), tr = items.filter(i => TYPES[i.type]?.transport);
  const push = (key, label, found, sub) => {
    if (found) rows.push({ done: true, label, sub, id: found.id });
    else if (ign.has(key)) rows.push({ done: true, ign: true, label, key });
    else rows.push({ done: false, label, k: miss.findIndex(m => m.key === key), key });
  };
  const out = tr.find(i => i.date === trip.start);
  push('out', `去程交通 · ${dayLabel(trip.start)}`, out, out && itemName(out));
  if (trip.end !== trip.start) { const back = tr.find(i => i.date === trip.end); push('back', `回程交通 · ${dayLabel(trip.end)}`, back, back && itemName(back)); }
  for (let n = trip.start; n < trip.end; n = addDays(n, 1)) { const h = hotelFor(items, n); push('night:' + n, `${dayLabel(n)} 晚 · 住处`, h, h && (h.title || '酒店')); }
  return rows;
}
function todoCard(trip, items, miss) {

function money(trip, items) {
  const members = trip.members, paid = {}, owe = {};
  members.forEach(m => { paid[m] = 0; owe[m] = 0; });
  let total = 0, unpaid = 0;
  for (const i of items) {
    const a = +i.amount || 0;
    if (!a) continue;
    total += a;
    if (!i.paidBy || !(i.paidBy in paid)) { unpaid++; continue; }
    paid[i.paidBy] += a;
    let sp = (i.splitAmong && i.splitAmong.length ? i.splitAmong : members).filter(m => m in owe);
    if (!sp.length) sp = members;
    sp.forEach(m => owe[m] += a / sp.length);
  }
  const bal = members.map(m => ({ m, v: Math.round((paid[m] - owe[m]) * 100) / 100 }));
  const cred = bal.filter(b => b.v > 0.004).sort((a, b) => b.v - a.v);
  const debt = bal.filter(b => b.v < -0.004).map(b => ({ m: b.m, v: -b.v })).sort((a, b) => b.v - a.v);
  const tx = [];
  let ci = 0, di = 0;
  while (ci < cred.length && di < debt.length) {
    const x = Math.min(cred[ci].v, debt[di].v);
    tx.push({ from: debt[di].m, to: cred[ci].m, v: x });
    cred[ci].v -= x; debt[di].v -= x;
    if (cred[ci].v < 0.005) ci++;
    if (debt[di].v < 0.005) di++;
  }
  return { total, paid, owe, tx, unpaid };
}

const QR_DEMO = 'data:image/svg+xml;utf8,' + encodeURIComponent((() => {
  let r = '', seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const fin = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
    if (!fin && rnd() > .55) r += `<rect x="${x * 8}" y="${y * 8}" width="8" height="8"/>`;
  }
  const f = (x, y) => `<rect x="${x}" y="${y}" width="56" height="56" fill="none" stroke="#333" stroke-width="8" transform="translate(4 4)"/><rect x="${x + 18}" y="${y + 18}" width="24" height="24"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#fff"/><g fill="#333">${r}${f(0, 0)}${f(144, 0)}${f(0, 144)}</g><rect x="50" y="84" width="100" height="32" rx="8" fill="#fff" stroke="#e0482f" stroke-width="3"/><text x="100" y="106" font-size="16" text-anchor="middle" fill="#e0482f" font-family="sans-serif">收款码占位</text></svg>`;
})());

function shrinkImage(file, max = 360) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', 0.8);
      if (!d.startsWith('data:image/webp')) { d = c.toDataURL('image/png'); if (d.length > 160000) d = c.toDataURL('image/jpeg', 0.82); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('图片读不出来')); };
    img.src = url;
  });
}

// ====== 图片识别（在手机本地运行，免费，不上传到任何服务器）======
const OCR_CDN = 'https://cdn.jsdelivr.net/npm/';
let ocrWorker = null;
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
async function getOcr(status) {
  if (ocrWorker) return ocrWorker;
  status('第一次使用，正在下载识别字库（约 9MB，之后就快了）…');
  if (!window.Tesseract) await loadScript(OCR_CDN + 'tesseract.js@5.1.1/dist/tesseract.min.js');
  ocrWorker = await Tesseract.createWorker(['chi_sim', 'eng'], 1, {
    workerPath: OCR_CDN + 'tesseract.js@5.1.1/dist/worker.min.js',
    corePath: OCR_CDN + 'tesseract.js-core@5.1.1',
    // 字库默认从 jsdelivr 的 @tesseract.js-data/<语言>/4.0.0_best_int 下载
    logger: m => { if (m.status === 'recognizing text') status(`识别中… ${Math.round(m.progress * 100)}%`); },
  });
  return ocrWorker;
}
function cleanOcr(t) {
  return t
    .replace(/([\u4e00-\u9fa5，。：；、（）【】])[ \t]+/g, '$1').replace(/[ \t]+(?=[\u4e00-\u9fa5，。：；、（）【】,])/g, '')
    .replace(/(票价|金额|实付|合计|总价|房费|支付|价格)[:：]?\s*[Y羊]\s*(?=\d)/g, '$1¥')
    .replace(/(\d)[ \t]+(?=[:：.\d])/g, '$1').replace(/([:：])[ \t]+(?=\d)/g, '$1')
    .replace(/[ \t]+/g, ' ').replace(/\n{2,}/g, '\n').trim();
}
async function ocrFiles(files) {
  if (!files || !files.length) return;
  const st = $('#ocrStatus'), status = m => { if (st) st.textContent = m; };
  try {
    const w = await getOcr(status);
    const texts = [];
    for (const f of files) {
      status('识别中…');
      const { data } = await w.recognize(f);
      texts.push(cleanOcr(data.text));
    }
    const txt = texts.join('\n');
    if ($('#pasteBox')) $('#pasteBox').value = txt;
    if (!txt.trim()) return status('没认出文字，换一张清楚点的截图试试');
    status('');
    doParse();
  } catch (e) {
    console.warn(e);
    status('识别失败：网络不好或者图片太大，可以重试，或者直接粘贴文字');
  }
}
let sampleIdx = 0;
function trySample() { $('#pasteBox').value = SAMPLES[sampleIdx++ % SAMPLES.length]; }
async function pasteClip() { try { $('#pasteBox').value = await navigator.clipboard.readText(); } catch { toast('读取不了剪贴板，请长按手动粘贴'); } }
function doParse() {
  const txt = $('#pasteBox').value;
  if (!txt.trim()) return toast('先粘贴内容');

  toast(r.date ? '识别好了，检查一下再保存' : '没认出日期，手动补一下');
}

  add({ type: 'expense', title: '晚饭 · 火锅', date: s, paidBy: '小李', amount: '386' });
  add({ type: 'ticket', title: '大熊猫基地门票', date: addDays(s, 1), time: '08:30', bookedBy: '小王', paidBy: '小王', amount: '110' });
  add({ type: 'expense', title: '小王的伴手礼', date: addDays(s, 2), paidBy: '小王', amount: '200', splitAmong: ['小王'] });
  location.hash = '#/t/' + id;
}

// ====== 意见反馈 ======
const DEVICE = (() => { let d = LS.get('tt_device', ''); if (!d) { d = tripUid(); LS.set('tt_device', d); } return d; })();
const fbTime = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const FB = {
  list: LS.get('tt_fb_cache', []), last: 0,
  async load() {
    if (!REMOTE) return false;
    this.last = Date.now();
    try {
      const rows = await Store.api('feedback?select=*&order=created_at.desc', { headers: { 'x-device-id': DEVICE } });
      const changed = stable(rows) !== stable(this.list);
      this.list = rows; LS.set('tt_fb_cache', rows); return changed;
    } catch (e) { console.warn(e); return false; }
  },
  unread() { const seen = LS.get('tt_fb_seen', ''); return this.list.filter(f => f.replied_at && f.replied_at > seen).length; },
  markSeen() { LS.set('tt_fb_seen', new Date().toISOString()); },
};
const backBtn = `<a href="javascript:void(0)" onclick="history.length > 1 ? history.back() : (location.hash = '#/')" class="back">‹</a>`;
function renderFeedback(skipLoad) {
  app.innerHTML = `
    <header class="top">${backBtn}<div class="tt"><h1>意见反馈</h1><div class="muted">想要什么功能、哪里不好用，都可以说</div></div></header>
    ${REMOTE ? '' : `<div class="banner">预览模式下发不出去，上线后才能用</div>`}
    <div class="w w-cream" style="padding:18px">
      ${CLOUD('', 'width:70px;float:right;margin:-6px -4px 0 8px')}
      <h2 style="margin-bottom:10px">✏️ 写给作者</h2>
      <textarea id="fb_text" rows="5" maxlength="2000" placeholder="写下你的建议或遇到的问题…"></textarea>
      <label style="margin-top:10px">联系方式（选填，微信号或手机号，方便作者找你）<input id="fb_contact" maxlength="100"></label>
      <button class="btn primary" id="fb_send" style="width:100%" onclick="sendFeedback()">发送给作者</button>
    </div>
    <div class="sec-title"><h2>📮 我的反馈</h2></div>
    ${FB.list.length ? FB.list.map(f => `<div class="daycard fb">
        <div class="fb-meta">${fbTime(f.created_at)} 发送</div>
        <div class="fb-text">${esc(f.content)}</div>
        ${f.reply ? `<div class="fb-reply"><b>作者回复</b>${esc(f.reply)}<div class="fb-meta">${fbTime(f.replied_at)}</div></div>`
          : `<div class="fb-wait">已送达，等作者回复～</div>`}
      </div>`).join('') : `<div class="empty" style="padding:20px 0">还没发过反馈</div>`}`;
  FB.markSeen();
  if (!skipLoad) FB.load().then(ch => { if (ch && isPage('feedback')) renderFeedback(true); });
}
async function sendFeedback() {
  const content = $('#fb_text').value.trim(), contact = $('#fb_contact').value.trim();
  if (!REMOTE) return toast('预览模式下发不出去');
  if (!content) return toast('先写点什么吧');
  const btn = $('#fb_send'); btn.disabled = true; btn.textContent = '发送中…';
  try {
    await Store.api('feedback', { method: 'POST', headers: { 'x-device-id': DEVICE, Prefer: 'return=minimal' }, body: JSON.stringify({ device: DEVICE, content, contact }) });
    toast('已发送，谢谢你 💛');
    await FB.load(); renderFeedback(true);
  } catch (e) { console.warn(e); toast('没发出去，检查一下网络再试'); btn.disabled = false; btn.textContent = '发送给作者'; }
}

// ====== 作者后台（#/admin）======
async function adminApi(path, opts = {}) {
  return Store.api(path, { ...opts, headers: { 'x-admin-key': LS.get('tt_admin', ''), ...(opts.headers || {}) } });
}
async function renderAdmin() {
  const head = `<header class="top">${backBtn}<div class="tt"><h1>作者后台</h1><div class="muted">所有反馈都在这里</div></div>
    ${LS.get('tt_admin', '') ? `<button class="chip" onclick="LS.set('tt_admin','');render()">退出</button>` : ''}</header>`;
  if (!LS.get('tt_admin', '')) {
    app.innerHTML = head + `<div class="w w-cream" style="padding:18px"><h2>🔑 输入作者口令</h2>
      <input id="adm_key" type="password" style="margin:12px 0" placeholder="作者口令">
      <button class="btn primary" style="width:100%" onclick="adminLogin()">进入</button></div>`;
    return;
  }
  app.innerHTML = head + `<div class="empty">加载中…</div>`;
  try {
    const rows = await adminApi('feedback?select=*&order=created_at.desc');
    const todo = rows.filter(r => !r.reply).length;
    app.innerHTML = head + `<div class="muted" style="margin:0 4px 12px">共 ${rows.length} 条，${todo} 条还没回复</div>` +
      (rows.map(f => `<div class="daycard fb ${f.reply ? '' : 'todo'}">
        <div class="fb-meta">${fbTime(f.created_at)}${f.contact ? ' · 联系方式：' + esc(f.contact) : ''}</div>
        <div class="fb-text">${esc(f.content)}</div>
        <textarea id="r_${f.id}" rows="2" placeholder="写回复…">${esc(f.reply || '')}</textarea>
        <div class="sheet-actions" style="margin-top:8px">
          <button class="btn danger" onclick="adminDel('${f.id}')">删除</button>
          <button class="btn primary" onclick="adminReply('${f.id}')">${f.reply ? '修改回复' : '回复'}</button></div>
      </div>`).join('') || `<div class="empty">还没有反馈</div>`);
  } catch (e) { app.innerHTML = head + `<div class="empty">加载失败：${esc(e.message)}</div>`; }
}
async function adminLogin() {
  const key = $('#adm_key').value.trim();
  if (!key) return;
  try {
    const ok = await Store.api('rpc/am_i_admin', { method: 'POST', json: true, body: '{}', headers: { 'x-admin-key': key } });
    if (ok !== true) return toast('口令不对');
    LS.set('tt_admin', key); render();
  } catch (e) { toast('连不上，稍后再试'); }
}
async function adminReply(id) {
  const reply = $('#r_' + id).value.trim();
  if (!reply) return toast('先写回复');
  try {
    await adminApi('feedback?id=eq.' + id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ reply, replied_at: new Date().toISOString() }) });
    toast('已回复，对方打开反馈页就能看到'); renderAdmin();
  } catch (e) { toast('没回复成功：' + e.message); }
}
async function adminDel(id) {
  if (!confirm('删除这条反馈？')) return;
  try { await adminApi('feedback?id=eq.' + id, { method: 'DELETE' }); renderAdmin(); } catch (e) { toast('删除失败'); }
}

// ====== 启动 ======
async function refresh() {
  if (Date.now() - FB.last > 60000 && FB.list.length) { const before = FB.unread(); await FB.load(); if (FB.unread() !== before && !isPage('admin')) render(); }
  if (isPage('feedback') || isPage('admin')) return;
  const id = route();
  const changed = id ? await Store.pull(id)
    : (await Promise.all(Mine.get().map(t => Store.pull(t)))).some(Boolean);
  if (changed || (id && !Store.docs[id])) render();
}
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); refresh(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Store.flush(); refresh(); } });
setInterval(() => { if (document.visibilityState === 'visible') { Store.flush(); refresh(); } }, 15000);
setInterval(() => { if (document.visibilityState === 'visible' && $('#sheet').classList.contains('hidden') && !isPage('admin') && !isPage('feedback')) render(); }, 60000);
render();
Store.flush();
refresh();
</script>
</body>
</html>
